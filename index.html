body{margin:0;background:var(--bg);color:var(--dark)}

.tabs button{border:1.5px solid var(--light);background:#fff;color:var(--dark);padding:9px 12px;border-radius:20px;font-weight:700;white-space:nowrap}
.tabs button.active{background:var(--dark);color:#fff}
.sec{display:none;padding:10px 10px 90px}.sec.active{display:block}
.stats{display:flex;gap:8px;overflow:auto;margin:10px 0}
.stat{min-width:110px;background:#fff;border-radius:12px;padding:10px;text-align:center;border:1.5px solid var(--light);font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border-radius:var(--r);padding:12px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.icon{width:54px;height:54px;background:var(--light);border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:flex-end}.modal.on{display:flex}
.box{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px}
input,select{width:100%;padding:11px;border:1px solid #cfe8d1;border-radius:10px;margin:5px 0}
.btn{background:var(--dark);color:#fff;border:none;padding:12px;border-radius:10px;width:100%;margin-top:6px;font-weight:800}
.list{border:1px solid var(--light);border-radius:12px;padding:10px;margin:6px 0;background:#fafffa;display:flex;justify-content:space-between;align-items:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--light);padding:8px 10px;display:flex;justify-content:space-around;z-index:6}
.card{position:relative}
.card b{font-size:13px;display:block;padding:0 4px}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:#c62828;color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px;font-weight:800}
.chip{display:inline-block;background:var(--light);color:var(--dark);border-radius:12px;padding:2px 9px;font-size:12px;font-weight:800;margin:1px}
.chip.ok{background:var(--dark);color:#fff}.chip.bad{background:#ffcdd2;color:#b71c1c}
.tb{border:1.5px solid var(--light);background:#fff;color:var(--dark);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:900}
label{display:block;font-weight:700;margin:8px 0 2px;font-size:14px}
input[type=checkbox]{width:auto;margin:0 0 0 6px}
textarea{width:100%;padding:11px;border:1px solid #cfe8d1;border-radius:10px;margin:5px 0;min-height:80px}
a.btn{display:block;text-align:center;text-decoration:none}
.lk{color:#fff;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:13px;border:none;font-weight:700}
.tl{display:flex;gap:4px;margin:8px 0}
.tl span{flex:1;text-align:center;font-size:11px;padding:4px 2px;border-radius:8px;background:var(--light);opacity:.55}
.tl span.on{background:var(--dark);color:#fff;opacity:1}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;margin:4px 0;background:#fff;border:1px solid var(--light)}
.bub.me{background:var(--dark);color:#fff}
.bub.other{margin-inline-start:auto}
.bars .b{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}
.bars .b div{flex:1;background:var(--light);border-radius:7px;height:14px;overflow:hidden}
.bars .b i{display:block;height:14px;background:var(--dark);border-radius:7px}
.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:20px;z-index:200;font-weight:700;max-width:90%;text-align:center}
.bottom .nv{flex:1;text-align:center;font-size:12px;font-weight:700;cursor:pointer;position:relative;opacity:.6}
.bottom .nv.on{opacity:1}
.bottom .nv span{display:block;font-size:20px}
.bottom .nv .d{display:none;position:absolute;top:0;left:55%;width:10px;height:10px;border-radius:50%;background:#c62828}
body.noauth .bottom,body.noauth #addbtn,body.noauth .tabs{display:none!important}
</style>

 if(!e){authMsg('اكتب البريد الإلكتروني');return}if(p.length<8){authMsg('كلمة السر 8 أحرف على الأقل');return}if(!r.name){authMsg('اكتب الاسم');return}
 authMsg('');authBusy(true);PEND=Object.assign(r,{email:e});
 try{await FB.register(e,p)}catch(err){PEND=null;authBusy(false);authMsg(errMsg(err))}}

async function createProfile(u){const P=PEND;PEND=null;
 const d={email:P.email||u.email||'',role:P.role,name:P.name,phone:P.phone,area:P.area,gps:'',prefs:{},ts:Date.now()};
 await FB.set('users',u.uid,clean(d));
 const t=ROLETYPE[P.role];
 if(t)await FB.set('ents',u.uid,clean({type:t,name:P.name,area:P.area,phone:P.phone,wa:'',gps:'',ownerUid:u.uid,approved:false,ts:Date.now()}));
 return Object.assign({id:u.uid},d)}
async function onUser(u){stopSync();
 if(!u){ME=null;S.view='home';showAuth('login');return}
 try{let me=await FB.get('users',u.uid);
  if(!me&&PEND)me=await createProfile(u);
  if(!me){showAuth('complete');return}
  ME=me;S.role=me.role==='admin'?(S.role&&ROLES.some(r=>r.id===S.role)?S.role:'admin'):me.role;
  if(me.role!=='admin')S.role=me.role;S.view='home';S.arg=null;
  startSync();show()}
 catch(e){ME=null;showAuth('login',errMsg(e))}}
function boot(){FB.onAuth(onUser)}

function stopSync(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];[srcEnt,srcOrd,srcPr].forEach(o=>{for(const k in o)delete o[k]});db=blank()}
function setEnts(k,rows){srcEnt[k]=rows;const m=new Map();Object.values(srcEnt).forEach(a=>a.forEach(x=>m.set(x.id,x)));['pharmacies','pharma','equip','delivery'].forEach(t=>{db[t]=[]});m.forEach(x=>{if(db[x.type])db[x.type].push(x)})}
function setOrders(k,rows){srcOrd[k]=rows;const m=new Map();Object.values(srcOrd).forEach(a=>a.forEach(x=>m.set(x.id,x)));db.orders=[...m.values()].sort((a,b)=>(b.ts||0)-(a.ts||0))}
function setPrices(k,rows){srcPr[k]=rows;db.prices={};Object.values(srcPr).forEach(a=>a.forEach(x=>{db.prices[x.id]=x}))}
function startSync(){const uid=myUid(),adm=isAdm(),R=ME.role;
 const L=(col,cons,cb)=>unsubs.push(FB.listen(col,cons,(rows,err)=>{if(err){console.warn(col,err.code||err);return}cb(rows);refresh()}));
 if(adm)L('ents',[],r=>setEnts('all',r));else{L('ents',[['approved','==',true]],r=>setEnts('pub',r));L('ents',[['ownerUid','==',uid]],r=>setEnts('mine',r))}
 L('products',[],r=>{db.products=r});
 if(adm)L('prices',[],r=>setPrices('all',r));else{L('prices',[['hide','==',false]],r=>setPrices('pub',r));L('prices',[['ownerUid','==',uid]],r=>setPrices('mine',r))}
 if(adm)L('orders',[],r=>setOrders('all',r));else{L('orders',[['fromUid','==',uid]],r=>setOrders('from',r));L('orders',[['toUid','==',uid]],r=>setOrders('to',r));if(R==='delivery')L('orders',[['needsDelivery','==',true]],r=>setOrders('del',r))}
 if(adm)L('complaints',[],r=>{db.complaints=r});else L('complaints',[['by','==',uid]],r=>{db.complaints=r});
 if(adm)L('msgs',[],r=>{db.msgs=r});else L('msgs',[['thread','==',uid]],r=>{db.msgs=r});
 if(adm)L('couriers',[],r=>{db.couriers=r});else if(R==='delivery')L('couriers',[['ownerUid','==',uid]],r=>{db.couriers=r});
 if(adm){L('subs',[],r=>{db.subs={};r.forEach(x=>{db.subs[x.id]=x})});L('users',[],r=>{db.users=r})}
 L('settings',[],r=>{const m=r.find(x=>x.id==='main');if(m)db.settings=Object.assign(DEFSET(),m,{comm:Object.assign(DEFSET().comm,m.comm||{})})})}

 const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('app').contains(a);
 if(typing||$('m').classList.contains('on')){dirty=true;return}

const ordersFor=c=>db.orders.filter(o=>c.k.includes(o.kind)&&(!c.f||c.f(o)));
function calc(o){const C=db.settings.comm,t=+o.total||0;
 const comm=t*(({rx:C.rx,supply:C.supply,equip:C.equip})[o.kind]||0)/100;
 const fee=o.needsDelivery===false?0:(+C.fixed||0)+t*(+C.pct||0)/100;
 const courier=fee*(+C.courier||0)/100;
 return{comm,fee,courier,app:comm+fee-courier}}

function readImg(f,max){max=max||720;return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(f)})}

function parseRows(txt){const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.');
 const lines=String(txt).replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
 const f=lines[0],d=f.includes('\t')?'\t':((f.match(/;/g)||[]).length>(f.match(/,/g)||[]).length?';':',');
 const rows=lines.map(l=>l.split(d).map(c=>norm(c.trim().replace(/^"|"$/g,''))));
 if(/اسم|name|دواء|منتج/i.test(rows[0][0])&&isNaN(parseFloat(rows[0][1])))rows.shift();
 return rows.filter(r=>r[0])}
function importRows(o,rows){if(!rows.length){toast('لا توجد بيانات');return}
 const ownerUid=myUid(),R=rows.slice(0,300);
 R.forEach(r=>{const id=uid();fset('products',id,{owner:o,ownerUid,name:r[0],unit:r[3]||'علبة',qty:Math.max(0,parseFloat(r[1])||0),exp:r[4]||'',photo:'',ts:Date.now()});fset('prices',id,{ownerUid,price:Math.max(0,parseFloat(r[2])||0),hide:false})});
 toast('تمت إضافة '+R.length+' صنف ✅'+(rows.length>300?' (الحد 300 في المرة)':''))}
function importFile(o,inp){const f=inp.files[0];if(!f)return;
 if(/\.xlsx?$/i.test(f.name)){toast('احفظ ملف Excel بصيغة CSV ثم ارفعه');return}
 const r=new FileReader();r.onload=()=>importRows(o,parseRows(r.result));r.readAsText(f)}

 return Object.keys(g).map(k=>{const ph=entOf('pharmacies',k);return `<h4 style="margin:12px 0 4px">🏥 ${ph?esc(ph.name):'غير محدد'}${ph&&waNum(ph)?` <a class="lk" style="background:#25D366" target="_blank" href="https://wa.me/${waNum(ph)}">واتساب</a>`:''}</h4>`+g[k].map(p=>`<div class="list"><span>${esc(p.name)}</span><span>${p.qty} ${esc(p.unit||'')}</span></div>`).join('')}).join('')||empty()}
SCR.stock=()=>['معرفة مخزون الصيدليات',`<input id="sq" placeholder="ابحث عن دواء..." oninput="$('sl').innerHTML=stockRows(this.value)"><div id="sl">${stockRows('')}</div>`];

SCR.pay=a=>{const L=ordersFor({k:RK[a||'all'],f:o=>o.status!=='cancelled'&&o.status!=='returned'});
 const paid=L.filter(o=>o.paid),un=L.filter(o=>!o.paid),sum=l=>l.reduce((s,o)=>s+(+o.total||0),0),cm=paid.reduce((s,o)=>s+calc(o).comm,0);
 return['التأكد من الدفع والعمولات',`<div class="stats"><div class="stat">✅ ${money(sum(paid))}<br><small>مدفوع</small></div><div class="stat">⏳ ${money(sum(un))}<br><small>غير مدفوع</small></div><div class="stat">💱 ${money(cm)}<br><small>عمولة محصلة</small></div></div>`+L.map(o=>{const c=calc(o);return `<div class="list"><div onclick="orderModal('${o.id}')" style="cursor:pointer"><b>#${o.no} · ${KIND[o.kind]}</b><br><small>من ${esc(o.from)} إلى ${esc(o.to)}</small><br><small>${money(o.total)} · عمولة ${money(c.comm)}${(ME.role==='delivery'||isAdm())?' · توصيل '+money(c.fee):''}</small></div>${canPay(o)?`<button class="lk" style="background:${o.paid?'var(--dark)':'#888'}" onclick="togglePay('${o.id}')">${o.paid?'✅ مدفوع':'تأكيد الدفع'}</button>`:chip(o.paid?'مدفوع':'غير مدفوع',o.paid?'ok':'')}</div>`}).join('')||empty()]};
SCR.report=a=>{a=RK[a]?a:'all';const L=ordersFor({k:RK[a]}),D=L.filter(o=>o.status==='done');
 const sales=D.reduce((s,o)=>s+(+o.total||0),0),cm=D.reduce((s,o)=>s+calc(o).comm,0),fee=D.reduce((s,o)=>s+calc(o).fee,0);
 const val=o=>a==='dl'?calc(o).fee:(+o.total||0);const days=[];
 for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d.getTime())}
 const rows=days.map(t=>{const l=L.filter(o=>o.ts>=t&&o.ts<t+864e5);return{t,n:l.length,v:l.reduce((s,o)=>s+val(o),0)}});const mx=Math.max(1,...rows.map(r=>r.v));
 return[a==='dl'?'التقارير والأرباح اليومية':'تقارير وتحليلات',`<div class="stats"><div class="stat">📦 ${L.length}<br><small>كل الطلبات</small></div><div class="stat">✅ ${D.length}<br><small>مكتملة</small></div><div class="stat">💰 ${money(sales)}<br><small>المبيعات</small></div><div class="stat">💱 ${money(cm)}<br><small>عمولة</small></div><div class="stat">🏍️ ${money(fee)}<br><small>أجرة توصيل</small></div></div><h4>آخر 7 أيام ${a==='dl'?'(أجرة التوصيل)':'(قيمة الطلبات)'}</h4><div class="bars">${rows.map(r=>`<div class="b"><span style="width:42px">${new Date(r.t).getDate()}/${new Date(r.t).getMonth()+1}</span><div><i style="width:${Math.round(r.v/mx*100)}%"></i></div><span>${r.n} · ${money(r.v)}</span></div>`).join('')}</div><h4>حسب الحالة</h4>${Object.keys(ST).map(k=>`<div class="list"><span>${ST[k]}</span><b>${L.filter(o=>o.status===k).length}</b></div>`).join('')}`]};

SCR.support=a=>{
 if(isAdm()&&!a){const th={};db.msgs.forEach(m=>{(th[m.thread]=th[m.thread]||[]).push(m)});
  return['الدعم - المحادثات',Object.keys(th).map(k=>{const l=th[k].slice().sort((x,y)=>x.ts-y.ts),last=l[l.length-1],u=l.find(m=>m.from==='user');return `<div class="list" onclick="go('support','${esc(k)}')" style="cursor:pointer"><div><b>${esc(u?u.name:'مستخدم')}</b> <small>${esc(u?ROLE_LBL[u.role]||'':'')}</small><br><small>${esc(String(last.text).slice(0,50))}</small></div><small>${fd(last.ts)}</small></div>`}).join('')||empty()]}
 const th=isAdm()?a:myUid(),me=isAdm()?'admin':'user';
 return['الدعم والتواصل مع الإدارة',`<div>${db.msgs.filter(m=>m.thread===th).sort((x,y)=>x.ts-y.ts).map(m=>`<div class="bub ${m.from===me?'me':'other'}">${esc(m.text)}<br><small style="opacity:.7">${fd(m.ts)}</small></div>`).join('')||empty()}</div><textarea id="mt" placeholder="اكتب رسالتك..." style="min-height:60px"></textarea><button class="btn" onclick="sendMsg('${esc(th)}')">إرسال</button><a class="btn" style="background:#25D366" target="_blank" href="https://wa.me/${esc(db.settings.adminWA)}">واتساب الإدارة</a>`]};
function sendMsg(th){const t=$('mt').value.trim();if(!t)return;fset('msgs',uid(),{thread:th,from:isAdm()?'admin':'user',text:t,name:ME.name,role:ME.role,ts:Date.now()});$('mt').value=''}

SCR.couriers=()=>['إدارة المناديب والأسطول',`<button class="btn" onclick="courierForm()">➕ إضافة مندوب</button>`+db.couriers.map(c=>{const n=db.orders.filter(o=>o.courier===c.id&&o.status==='done').length,a=db.orders.filter(o=>o.courier===c.id&&act(o)).length;
 return `<div class="list"><div><b>🏍️ ${esc(c.name)}</b> ${chip(c.active===false?'موقوف':'نشط',c.active===false?'bad':'ok')}<br><small>${esc(c.phone)} · ${esc(c.vehicle||'')} ${esc(c.plate||'')}</small><br><small>مكتمل: ${n} · جارٍ: ${a}</small></div><div style="display:flex;flex-direction:column;gap:4px">${c.phone?`<a class="lk" style="background:var(--dark)" href="tel:${esc(c.phone)}">اتصال</a>`:''}<button class="lk" style="background:#888" onclick="toggleCourier('${c.id}')">${c.active===false?'تفعيل':'إيقاف'}</button><button class="lk" style="background:#ffcdd2;color:#b71c1c" onclick="delCourier('${c.id}')">حذف</button></div></div>`}).join('')];
function courierForm(){openM(`<h3>🏍️ مندوب جديد</h3><input id="cu_n" placeholder="الاسم"><input id="cu_p" type="tel" placeholder="الهاتف"><input id="cu_v" placeholder="المركبة (موتور / ركشة / سيارة)"><input id="cu_l" placeholder="رقم اللوحة"><button class="btn" onclick="saveCourier()">حفظ</button><button class="btn" style="background:#888" onclick="closeM()">إلغاء</button>`)}
function saveCourier(){const n=$('cu_n').value.trim();if(!n){toast('اكتب الاسم');return}fset('couriers',uid(),{ownerUid:myUid(),name:n,phone:$('cu_p').value.trim(),vehicle:$('cu_v').value.trim(),plate:$('cu_l').value.trim(),active:true});closeM()}
function toggleCourier(id){const c=db.couriers.find(x=>x.id===id);if(c)fupd('couriers',id,{active:c.active===false})}
function delCourier(id){if(confirm('حذف المندوب؟'))fdel('couriers',id)}
SCR.calc=()=>{const C=db.settings.comm;return['حساب العمولة (ثابت + نسبة)',`<div class="list" style="display:block">الإعداد الحالي: ثابت ${money(C.fixed)} + ${C.pct}% من قيمة الطلب · نصيب المندوب ${C.courier}%</div><label>قيمة الطلب (ج)</label><input id="cc" type="number" inputmode="decimal" oninput="calcLive()"><div id="cr" class="list" style="display:block">أدخل قيمة الطلب</div>`]};
function calcLive(){const v=+$('cc').value||0,r=calc({kind:'supply',total:v}),C=db.settings.comm;$('cr').innerHTML=`أجرة التوصيل: <b>${money(r.fee)}</b><br>نصيب المندوب: <b>${money(r.courier)}</b><br>حصة التطبيق من التوصيل: <b>${money(r.fee-r.courier)}</b><br>عمولة التوريد (${C.supply}%): <b>${money(r.comm)}</b>`}
SCR.comm=()=>['العمولات الست',Object.keys(CL).map(k=>`<label>${CL[k]}</label><input id="c_${k}" type="number" inputmode="decimal" min="0" value="${db.settings.comm[k]}">`).join('')+`<button class="btn" onclick="saveComm()">حفظ</button>`];
function saveComm(){const c={};for(const k of Object.keys(CL)){const v=+$('c_'+k).value;if(isNaN(v)||v<0||(k!=='fixed'&&v>100)){toast('قيمة غير صحيحة: '+CL[k]);return}c[k]=v}fset('settings','main',{comm:c},true);toast('تم الحفظ ✅')}

SCR.subs=()=>{const all=[];Object.keys(DT).forEach(t=>db[t].forEach(e=>all.push({t,e})));const today=new Date().toISOString().slice(0,10);
 const due=all.reduce((s,x)=>{const u=db.subs[x.e.id];return s+((u&&u.until&&u.until>=today)?(+u.fee||0):0)},0);
 return['الاشتراكات الشهرية',`<div class="stats"><div class="stat">💰 ${money(due)}<br><small>اشتراكات فعالة</small></div><div class="stat">👥 ${all.length}<br><small>جهة</small></div></div>`+(all.map(({t,e})=>{const s=db.subs[e.id]||{fee:0,until:''},ok=!!s.until&&s.until>=today;
  return `<div class="list" style="display:block"><b>${ICON[t]} ${esc(e.name)}</b> <small>(${SING[t]})</small> ${chip(ok?'فعال حتى '+s.until:'منتهي / غير مشترك',ok?'ok':'bad')}<div style="display:flex;gap:6px;align-items:center"><input type="number" inputmode="numeric" value="${s.fee||''}" placeholder="الاشتراك الشهري (ج)" onchange="setFee('${e.id}',this.value)"><button class="btn" style="width:auto;margin:5px 0;padding:11px 14px;white-space:nowrap" onclick="renew('${e.id}')">تجديد شهر</button></div></div>`}).join('')||empty())]};
function subOwner(id){const e=[].concat(db.pharmacies,db.pharma,db.equip,db.delivery).find(x=>x.id===id);return e?(e.ownerUid||id):id}
function setFee(id,v){fset('subs',id,{fee:Math.max(0,+v||0),ownerUid:subOwner(id)},true);toast('تم الحفظ ✅')}
function renew(id){const s=db.subs[id]||{};const b=new Date(Math.max(Date.now(),s.until?new Date(s.until).getTime():0));b.setDate(b.getDate()+30);fset('subs',id,{until:b.toISOString().slice(0,10),ownerUid:subOwner(id)},true);toast('تم التجديد ✅')}
SCR.settings=()=>['الإعدادات',`<div class="list" style="display:block">🎨 اللون: أخضر دوائي (مقفول V6)<br>🌐 اللغة: العربية<br>☁️ المشروع: dawayi-e3b2c</div><label>رقم واتساب الإدارة (249...)</label><input id="st_w" type="tel" value="${esc(db.settings.adminWA)}" onchange="fset('settings','main',{adminWA:this.value.replace(/\\D/g,'')},true);toast('تم الحفظ ✅')"><div class="list" style="display:block;font-size:13px">لحجب سعر صنف: من شاشة المنتج ← "حجب السعر"، ويُطبَّق الحجب في قاعدة البيانات نفسها.</div>`];
SCR.policies=()=>isAdm()?['السياسات',`<textarea id="pl_t" style="min-height:220px">${esc(db.settings.policies)}</textarea><button class="btn" onclick="fset('settings','main',{policies:$('pl_t').value},true);toast('تم الحفظ ✅')">حفظ</button>`]:['السياسات والشروط',`<div class="list" style="display:block;white-space:pre-wrap;line-height:1.9">${esc(db.settings.policies)}</div>`];

document.body.classList.add('noauth');
$('app').innerHTML='<div class="sec active"><div class="list">⏳ جاري الاتصال...</div></div>';
const FAILBOX=t=>'<div class="sec active"><div class="list" style="background:#ffcdd2;color:#b71c1c;display:block;line-height:1.9">'+t+'</div></div>';
if(location.protocol==='file:')$('app').innerHTML=FAILBOX('⚠️ التطبيق مفتوح كملف من الجهاز، ودخول Firebase لا يعمل بهذه الطريقة.<br>يجب فتحه من رابط ويب (https) بعد رفعه على استضافة مجانية.');
setTimeout(()=>{if(!ME&&document.body.classList.contains('noauth')&&$('app').innerHTML.includes('جاري الاتصال'))$('app').innerHTML=FAILBOX(window.FB?'تعذر الاتصال بخدمة الدخول. تحقق من الإنترنت، ومن أن رابط الصفحة مضاف في Firebase ← Authentication ← Settings ← Authorized domains.':'تعذر تحميل خدمة Firebase. تحقق من الإنترنت ثم أعد فتح التطبيق.')},12000);
if(window.FB)boot();else window.addEventListener('fb-ready',boot);
</script>
